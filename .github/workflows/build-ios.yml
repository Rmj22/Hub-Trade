name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which app to build"
        required: true
        default: "app"
        type: choice
        options:
          - app
          - extension
          - both

env:
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  app:
    if: inputs.target == 'app' || inputs.target == 'both'
    name: Build & Upload App
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Point app at deployed backend
        run: |
          cd ios-app
          sed -i '' "s#https://YOUR-DEPLOYED-HUB-TRADE-URL#${{ secrets.HUB_TRADE_URL }}#" capacitor.config.json

      - name: Install dependencies
        run: |
          cd ios-app
          npm install
          npx cap sync ios

      - name: Bump build number
        run: |
          cd ios-app/ios/App
          agvtool new-version -all "${{ github.run_number }}"

      - name: Build & archive
        run: |
          cd ios-app
          mkdir -p build
          sed "s/YOUR_TEAM_ID/$APPLE_TEAM_ID/" ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/HubTrade.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic -allowProvisioningUpdates -skipPackagePluginValidation \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} archive

      - name: Export .ipa
        run: |
          cd ios-app
          xcodebuild -exportArchive -archivePath build/HubTrade.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/ipa -allowProvisioningUpdates

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios-app/build/ipa/*.ipa

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ios-app/build/ipa/App.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_KEY_P8 }}
          wait-for-processing: 'false'

  extension:
    if: inputs.target == 'extension' || inputs.target == 'both'
    name: Build & Upload Safari Extension
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Fill in extension build/export/upload steps here, following the
      # same pattern as the app job above, pointed at the safari-extension/ folder.
