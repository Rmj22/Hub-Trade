name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Install iOS dependencies
        run: |
          cd ios-app
          npm install

      - name: Create iOS project
        run: |
          cd ios-app
          npx cap add ios
          npx cap sync ios

      - name: Create App Store Connect API key
        run: |
          echo '${{ secrets.APPLE_PRIVATE_KEY }}' > "$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_KEY_ID }}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_KEY_ID }}.p8"

      - name: Build archive
        run: |
          cd ios-app

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HubTrade.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PRODUCT_BUNDLE_IDENTIFIER="com.summitofficesolution.tradehub" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPLE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPLE_ISSUER_ID }}" \
            -allowProvisioningUpdates \
            archive

      - name: Create ExportOptions.plist
        run: |
          cd ios-app

          sed "s/YOUR_TEAM_ID/${{ secrets.APPLE_TEAM_ID }}/" \
            ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        run: |
          cd ios-app

          mkdir -p "$RUNNER_TEMP/export"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/HubTrade.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
