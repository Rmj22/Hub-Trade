name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Debug secret length
        run: |
          echo "Length: ${#BUILD_PROVISION_PROFILE_BASE64}"
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Install iOS dependencies
        run: |
          cd ios-app
          npm install

      - name: Create iOS project
        run: |
          cd ios-app
          npx cap add ios

      - name: Disable code signing for Pods targets
        run: |
          cd ios-app/ios/App
          ruby -e '
            podfile_path = "Podfile"
            content = File.read(podfile_path)

            injection = <<~RUBY
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                  config.build_settings["CODE_SIGN_IDENTITY"] = ""
                  config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                  config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ""
                end
              end
            RUBY

            if content =~ /post_install do \|installer\|/
              content = content.sub(/post_install do \|installer\|/, "post_install do |installer|\n#{injection}")
            else
              content += "\n\npost_install do |installer|\n#{injection}end\n"
            end

            File.write(podfile_path, content)
          '
          echo "----- Resulting Podfile -----"
          cat Podfile

      - name: Sync iOS project
        run: |
          cd ios-app
          npx cap sync ios

      - name: Configure signing on App target only
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios-app/ios/App
          ruby -e '
            require "xcodeproj"

            project = Xcodeproj::Project.open("App.xcodeproj")

            app_target = project.targets.find { |t| t.name == "App" }
            raise "App target not found" unless app_target

            app_target.build_configurations.each do |config|
              config.build_settings["CODE_SIGN_STYLE"] = "Manual"
              config.build_settings["DEVELOPMENT_TEAM"] = ENV["APPLE_TEAM_ID"]
              config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = "TradeHA"
              config.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              config.build_settings["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
            end

            project.save
          '

      - name: Import Code-Signing Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Install Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          PROFILES_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES_DIR"
          cp "$PROFILE_PATH" "$PROFILES_DIR"

      - name: Build archive
        run: |
          cd ios-app

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HubTrade.xcarchive" \
            archive

      - name: Package IPA manually
        run: |
          set -e
          EXPORT_DIR="$RUNNER_TEMP/export"
          PAYLOAD_DIR="$EXPORT_DIR/Payload"

          mkdir -p "$PAYLOAD_DIR"

          cp -R "$RUNNER_TEMP/HubTrade.xcarchive/Products/Applications/App.app" "$PAYLOAD_DIR/"

          cd "$EXPORT_DIR"
          zip -r -y "HubTrade.ipa" Payload

          echo "----- IPA contents -----"
          unzip -l "$EXPORT_DIR/HubTrade.ipa" | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/HubTrade.ipa

      - name: Sanity-check ASC credentials (no secrets printed)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "Key ID length: ${#ASC_KEY_ID} (should be 10, no spaces/newlines)"
          echo "Issuer ID length: ${#ASC_ISSUER_ID} (should be 36, a UUID)"
          echo "P8 first line: $(echo "$ASC_API_KEY_P8" | head -n1)"
          echo "P8 last line: $(echo "$ASC_API_KEY_P8" | tail -n1)"
          echo "P8 line count: $(echo "$ASC_API_KEY_P8" | wc -l) (should be ~4-5)"
          # First line must read exactly: -----BEGIN PRIVATE KEY-----
          # Last non-empty line must read exactly: -----END PRIVATE KEY-----
          # If Key/Issuer ID length looks off, or BEGIN/END lines don't match exactly,
          # re-copy the secret from appstoreconnect.apple.com with no extra whitespace.

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/export/HubTrade.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_KEY_P8 }}
          wait-for-processing: 'false'
