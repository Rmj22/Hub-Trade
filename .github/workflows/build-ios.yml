name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods
        run: |
          if [ -f "frontend/ios/Podfile" ]; then
            cd frontend/ios
            pod install
          fi

      - name: Create App Store Connect API key
        run: |
          echo '${{ secrets.APPLE_PRIVATE_KEY }}' > "$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_KEY_ID }}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_KEY_ID }}.p8"

      - name: Build archive
        run: |
          cd frontend/ios

          xcodebuild \
            -workspace App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPLE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPLE_ISSUER_ID }}" \
            archive

      - name: Export IPA
        run: |
          cd frontend/ios

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist App/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
