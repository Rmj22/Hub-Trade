# yaml-language-server: $schema=https://codemagic.io

workflows:
my-build-pipeline:
name: Production App Deployment
max_build_duration: 60
instance_type: mac_mini_m2

environment:
  groups:
    - apple_credentials

  vars:
    XCODE_WORKSPACE: "frontend/ios/App/App.xcworkspace"
    XCODE_PROJECT: "frontend/ios/App/App.xcodeproj"
    XCODE_SCHEME: "App"
    BUNDLE_ID: "com.summitofficesolution.tradehub"

  xcode: latest
  cocoapods: default

triggering:
  events:
    - push

  branch_patterns:
    - pattern: "main"
      include: true

scripts:

  - name: Initialize Keychain
    script: |
      keychain initialize

  - name: Fetch Apple Signing Profiles
    script: |
      app-store-connect fetch-signing-files "$BUNDLE_ID" \
        --type IOS_APP_STORE \
        --create

  - name: Install Web Dependencies & Build React App
    script: |
      cd frontend
      npm install --force
      CI=false npm run build

  - name: Sync React Web Assets into iOS Shell
    script: |
      cd frontend
      npx cap sync ios

  - name: Install CocoaPods Dependencies
    script: |
      cd "$CM_BUILD_DIR/frontend/ios/App"
      pod install

  - name: Set Xcode Project Profile Configuration
    script: |
      cd "$CM_BUILD_DIR"
      xcode-project use-profiles \
        --project "$XCODE_PROJECT"

  - name: Build Production .ipa Package
    script: |
      xcode-project build-ipa \
        --project "frontend/ios/App/App.xcodeproj" \
        --scheme "App" \
        --config "Release" \
        --export-options-plist "frontend/ios/App/ExpotOptions.plist" \
        --ipa-directory "build/ios/ipa"

artifacts:
  - build/ios/ipa/*.ipa

publishing:
  app_store_connect:
    auth: integration
    api_key: $APP_STORE_CONNECT_PRIVATE_KEY
    key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
    issuer_id: $APP_STORE_CONNECT_ISSUER_ID
    submit_to_testflight: true