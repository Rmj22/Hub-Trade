# yaml-language-server: $schema=https://codemagic.io
workflows:
  my-build-pipeline:
    name: Production App Deployment
    max_build_duration: 60
    instance_type: mac_mini_m1

    # 👇 ADD THIS BLOCK TO FIX THE VALIDATION ERROR
    integrations:
      app_store_connect: app_store_credentials # Must match the exact label name of your App Store Connect API Key integration

    environment:
      groups:
        - apple_credentials 
      vars:
        APP_NAME: "Hub-Trade"
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true

    scripts:
      - name: Initialize Keychain
        script: keychain initialize
          
      - name: Fetch Apple Signing Profiles
        script: app-store-connect fetch-signing-files "com.yourcompany.Hub-Trade" --project-type IOS --create
          
      - name: Set Xcode Project Profile Configuration
        script: xcode-project use-profiles
          
      - name: Build Production .ipa Package
        script: |
          xcode-project build-ipa \
            --workspace "Hub-Trade.xcworkspace" \
            --scheme "Hub-Trade" \
            --configuration Release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration # 👈 This relies directly on the "integrations" block added above
        submit_to_testflight: true
