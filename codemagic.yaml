# yaml-language-server: $schema=https://codemagic.io
workflows:
  my-build-pipeline:
    name: Production App Deployment
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      groups:
        - apple_credentials # ⚠️ Make sure this has exactly 8 spaces of indentation
      vars:
        APP_NAME: "Hub-Trade"
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true

    scripts:
      - name: Initialize Keychain
        script: keychain initialize
          
      - name: Fetch Apple Signing Profiles
        script: |
          app-store-connect fetch-signing-files "com.summitofficesolution.tradehub" --project-type IOS --create
          
      - name: Set Xcode Project Profile Configuration
        script: xcode-project use-profiles
          
      - name: Build Production .ipa Package
        script: |
          xcode-project build-ipa \
            --workspace "Hub-Trade.xcworkspace" \
            --scheme "Hub-Trade" \
            --configuration Release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
