# yaml-language-server: $schema=https://codemagic.io

workflows:
  my-build-pipeline:
    name: Production App Deployment
    max_build_duration: 60
    instance_type: mac_mini_m1
      - name: Install Web Dependencies & Build React App
        script: |
          cd frontend
          npm install --force # 👈 Changed from --legacy-peer-deps to --force to align with your project structure
          npm run build

    environment:
      groups:
        - apple_credentials

      vars:
        APP_NAME: "tradehub"
        BUNDLE_ID: "com.summitofficesolution.tradehub"
        XCODE_WORKSPACE: "frontend/tradehub.xcworkspace"
        XCODE_SCHEME: "tradehub"

      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push

      branch_patterns:
        - pattern: "main"
          include: true

    scripts:
      - name: Initialize Keychain
        script: |
          keychain initialize

      - name: Fetch Apple Signing Profiles
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add Apple Certificates
        script: |
          keychain add-certificates

      - name: Set Xcode Project Profile Configuration
        script: |
          xcode-project use-profiles

      - name: Verify iOS Project
        script: |
          echo "=== Repository ==="
          ls -la

          echo "=== Frontend ==="
          ls -la "$CM_BUILD_DIR/frontend" || true

          echo "=== Xcode Workspaces ==="
          find "$CM_BUILD_DIR" -name "*.xcworkspace" -print

          echo "=== Xcode Projects ==="
          find "$CM_BUILD_DIR" -name "*.xcodeproj" -print

      - name: Build Production IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --configuration Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true