# yaml-language-server: $schema=https://codemagic.io/codemagic-schema.json
# The top-level workflows tag contains all your distinct build definitions
workflows:
  my-build-pipeline: # The unique ID for this specific workflow
    name: Production App Deployment
    max_build_duration: 60 # Set maximum execution minutes (1 to 120)
    instance_type: mac_mini_m1 # Defines the cloud build machine hardware

    # Environment settings, variables, and language runtimes
    environment:
      groups:
        - apple_credentials # References secret groupings set in Codemagic UI
      vars:
        APP_NAME: "Hub-Trade"
      xcode: latest
      cocoapods: default

    # Continuous Integration rules to trigger builds automatically
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true

    # Sequential command line actions executed on the virtual machine
    scripts:
      - name: Say Hello
        script: |
          echo "Starting build process for $APP_NAME..."

    # Local output formats to grab and collect when processing completes
    artifacts:
      - build/ios/ipa/*.ipa
