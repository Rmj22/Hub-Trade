workflows:
  my-build-pipeline:
    name: Production App Deployment
    max_build_duration: 60
    instance_type: mac_mini_m1 # Defines the cloud build machine hardware

    environment:
      groups:
        - apple_credentials 
      vars:
        APP_NAME: "Hub-Trade"
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true

    # PASTE THE CODE HERE (Make sure "scripts:" aligns perfectly with "triggering:" above)
    scripts:
      - name: Initialize Keychain
        script: keychain initialize
          
      - name: Fetch Apple Signing Profiles
        script: app-store-connect fetch-signing-files "com.SummitOfficeSolution.Hub-Trade" --project-type IOS --create
          
      - name: Set Xcode Project Profile Configuration
        script: xcode-project use-profiles
          
      - name: Build Production .ipa Package
        script: |
          xcode-project build-ipa \
            --workspace "Hub-Trade.xcworkspace" \
            --scheme "Hub-Trade" \
            --configuration Release

    # Instructs Codemagic to look for and capture the binary file
    artifacts:
      - build/ios/ipa/*.ipa

    # Uploads the file automatically to App Store Connect / TestFlight
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
