# yaml-language-server: $schema=https://codemagic.io
workflows:
  my-build-pipeline:
    name: Production App Deployment
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      groups:
        - apple_credentials
      vars:
        XCODE_WORKSPACE: "frontend/ios/App/App.xcworkspace"
        XCODE_PROJECT: "frontend/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.summitofficesolution.tradehub"
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true

    scripts:
      - name: Initialize Keychain
        script: |
          keychain initialize
          
      - name: Fetch Apple Signing Profiles
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          
      - name: Install Web Dependencies & Build React App
        script: |
          cd frontend
          npm install --force
          CI=false npm run build

      - name: Sync React Web Assets into iOS Shell
        script: |
          cd frontend
          npx cap sync ios
          
      - name: Set Xcode Project Profile Configuration
        script: |
          cd frontend/ios/App
          pod install
          xcode-project use-profiles
          
      - name: Build Production .ipa Package
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/ios/archive/App.xcarchive" \
            archive

    artifacts:
      - "**/*.ipa"

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
