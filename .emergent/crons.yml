crons:
  - name: trial-reminders
    description: "Daily 14:00 UTC: 5-day trial reminders, archive ended trials, purge accounts archived 5+ days"
    cron: "0 14 * * *"
    endpoint: "{{BASE_URL}}/api/cron/trial-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
